<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIA&CO · Motor de Operaciones</title><link rel="stylesheet" href="styles.css"><style>.wrap{max-width:850px;margin:auto;padding:20px}.card{border:1px solid #ddd;border-radius:18px;padding:18px;margin:14px 0;background:#fff}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eee}.grid{display:grid;gap:10px}.event{padding:11px;background:#f7f7f5;border-radius:10px}.controls{display:flex;flex-wrap:wrap;gap:8px}button{border:0;border-radius:12px;padding:11px 14px;background:#171717;color:#fff}.danger{background:#555}.muted{color:#666}</style></head><body><main class="wrap"><section class="card"><span class="pill">DEMO · SIN FONDOS REALES</span><h1>Motor de Operaciones FIA&CO v1</h1><p>Una única operación coordina aceptación, logística, evidencia, incidencias y la futura instrucción al proveedor de pagos autorizado.</p></section><section class="card"><h2 id="state"></h2><div class="controls"><button id="advance">Ejecutar siguiente condición</button><button id="dispute" class="danger">Abrir incidencia</button><button id="reset" class="danger">Nueva operación</button></div><p id="release" class="muted"></p></section><section class="card"><h2>Condiciones</h2><div id="conditions" class="grid"></div></section><section class="card"><h2>Registro de evidencias</h2><div id="evidence" class="grid"></div></section><p><a href="app-beta.html">← Volver a la beta</a></p></main><script src="operation-engine.js"></script><script>const E=FIAOperationEngine;let op;let step=0;const flow=[()=>{E.move(op,'AWAITING_ACCEPTANCE','comprador');E.setCondition(op,'sellerAccepted',true,'vendedor');E.move(op,'CONDITIONED','vendedor')},()=>{E.setCondition(op,'courierVerified',true,'empresa-paqueteria');E.move(op,'IN_PROGRESS','sistema')},()=>{E.setCondition(op,'delivered',true,'repartidor-verificado');E.move(op,'DELIVERED','repartidor-verificado')},()=>{E.setCondition(op,'buyerAccepted',true,'comprador');E.move(op,'ACCEPTED','comprador')},()=>E.requestRelease(op,'motor-reglas'),()=>E.move(op,'CLOSED','psp-sandbox',{confirmation:'SIMULATED'})];function init(){op=E.create({kind:'compraventa-envio',amount:149.90,buyer:'cliente-A',seller:'cliente-B',actor:'cliente-A'});step=0;render()}function render(){state.textContent='Estado: '+op.state;conditions.innerHTML=Object.entries(op.conditions).map(([k,v])=>`<div class="event">${v?'✓':'○'} ${k}</div>`).join('');evidence.innerHTML=op.evidence.slice().reverse().map(e=>`<div class="event"><strong>${e.type}</strong><br><span class="muted">${e.actor} · ${new Date(e.at).toLocaleTimeString()}</span></div>`).join('');release.textContent=op.releaseRequested?'Se ha generado únicamente una instrucción simulada para PSP; FIA&CO no mueve fondos.':'La liberación permanece bloqueada hasta cumplir todas las condiciones.'}advance.onclick=()=>{try{if(step<flow.length){flow[step++]();render()}}catch(e){alert('Bloqueado por el motor: '+e.message)}};dispute.onclick=()=>{try{E.dispute(op,'cliente','Incidencia demo');render()}catch(e){alert(e.message)}};reset.onclick=init;init();</script></body></html>
