<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIA&CO — Catálogo demo</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav><div class="wrap nav-inner"><div class="logo">FIA<span>&</span>CO</div><div class="navlinks"><a href="index.html">Inicio</a><a href="products.html">Catálogo</a><a href="cart.html">Carrito</a></div></div></nav>
<section class="section"><div class="wrap"><span class="badge">CATÁLOGO DE DEMOSTRACIÓN</span><h1 style="font-size:44px">Casos de uso</h1><p class="lead">Los importes son ilustrativos. En producción, el backend será la única autoridad sobre precios, disponibilidad y total final.</p><div id="grid" class="grid"></div></div></section>
<footer><div class="wrap">FIA&CO · Demo sin pagos reales.</div></footer>
<script src="js/products.js"></script><script src="js/cart.js"></script>
<script>
const grid=document.getElementById('grid');
FIA_PRODUCTS.forEach(p=>{
 const card=document.createElement('article');card.className='card';
 const h=document.createElement('h3');h.textContent=p.name;
 const d=document.createElement('p');d.className='muted';d.textContent=p.description;
 const price=document.createElement('p');price.className='price';price.textContent=fiaMoney(p.price,p.currency);
 const actions=document.createElement('div');actions.className='actions';
 const view=document.createElement('a');view.className='btn alt';view.href='product.html?id='+encodeURIComponent(p.id);view.textContent='Ver detalle';
 const b=document.createElement('button');b.className='btn';b.type='button';b.textContent='Añadir al carrito';
 b.addEventListener('click',()=>{if(fiaAddToCart(p.id,1)){b.textContent='Añadido ✓';setTimeout(()=>b.textContent='Añadir al carrito',1200)}});
 actions.append(view,b);card.append(h,d,price,actions);grid.appendChild(card);
});
</script>
</body></html>
