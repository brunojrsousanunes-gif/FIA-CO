<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIA&CO · Backoffice demo</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container"><h1>Backoffice comercial · Demo</h1><p>Datos ficticios. No usar PII ni operaciones reales.</p><section><h2>Nueva oportunidad</h2><label>Segmento <select id="segment"><option value="TRANSPORT">Transporte</option><option value="INDUSTRIAL_AGRI">Maquinaria industrial/agrícola</option><option value="CONSTRUCTION">Construcción</option><option value="OTHER">Otro</option></select></label><label>Valor operación (€) <input id="amount" type="number" min="1" value="8000"></label><button id="quote">Calcular</button><pre id="result"></pre></section><section><h2>Indicadores demo</h2><pre id="summary"></pre></section></main><script src="js/pricing.js"></script><script src="js/commercial-dashboard.js"></script><script>const demo=[{state:'OPPORTUNITY',segment:'TRANSPORT',amount:8000,fee:59.9,externalCost:15,founderHours:.5,founderHourlyValue:25},{state:'PROPOSAL',segment:'INDUSTRIAL_AGRI',amount:15000,fee:82.5,externalCost:20,founderHours:.75,founderHourlyValue:25}];function render(){summary.textContent=JSON.stringify(FIACOCommercial.summarize(demo),null,2)}quote.onclick=()=>{const a=Number(amount.value);const q=FIACOPricing.quote(a);result.textContent=JSON.stringify(q,null,2)};render();</script></body></html>
