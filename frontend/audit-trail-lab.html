<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>FIA&CO — Audit Trail Lab</title><link rel="stylesheet" href="css/style.css"><style>body{padding:16px}.lab{max-width:820px;margin:auto}.card{padding:16px;margin:14px 0;border:1px solid #ddd;border-radius:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:5px}input,select{padding:10px;border:1px solid #bbb;border-radius:10px;font:inherit}.row{padding:10px;border-bottom:1px solid #eee}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="lab"><p class="muted small">BETA · AUDITORÍA EN MEMORIA · NO PII · NO LOG REMOTO · NO PERSISTENCIA</p><h1>Audit Trail Lab</h1><p>Registra eventos técnicos seguros con identificadores sintéticos, motivo y estado. No acepta campos personales, secretos ni datos financieros sensibles.</p><div class="card grid"><label>ID sintético<input id="entity" value="MGT-DEMO-001"></label><label>Evento<select id="type"><option>FLOW_CREATED</option><option>CLASSIFIED</option><option>TASK_DRAFTED</option><option>ESCALATED</option><option>METRIC_SNAPSHOT</option><option>PROVIDER_POLICY_CHECKED</option><option>PILOT_GATE_CHECKED</option><option>PRODUCTION_GATE_CHECKED</option></select></label><label>Estado<select id="status"><option>SIMULATED</option><option>DRAFTED</option><option>QUEUED</option><option>ESCALATED</option><option>CHECKED</option><option>BLOCKED</option><option>READY</option></select></label><label>Reason code<input id="reason" value="DEMO_CHECK"></label></div><div class="card"><button class="btn" id="add">Añadir evento seguro</button> <button class="btn" id="reset">Vaciar memoria</button></div><div class="card"><h2>Eventos</h2><div id="events"><p class="muted">Sin eventos.</p></div></div><a class="btn" href="v1-readiness.html">Cierre v1</a></main><script src="js/audit-trail.js"></script><script>let log=[];const $=id=>document.getElementById(id);function render(){const s=FIACOAuditTrail.summarize(log);$('events').innerHTML=log.length?log.slice().reverse().map(e=>`<div class="row"><strong>${e.type}</strong> · ${e.status}<br><small>${e.entityId} · ${e.reasonCode}</small></div>`).join(''):`<p class="muted">Sin eventos. Conteo ${s.count}.</p>`;}$('add').onclick=()=>{try{log=FIACOAuditTrail.append(log,{entityId:$('entity').value,type:$('type').value,status:$('status').value,reasonCode:$('reason').value});render()}catch(e){alert(e.message)}};$('reset').onclick=()=>{log=[];render()};render();</script></body></html>
