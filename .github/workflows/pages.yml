name: Deploy FIA&CO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in frontend/js/*.js tests/*.mjs tests/*.js server/*.mjs scripts/*.mjs; do node --check "$file"; done
      - name: Verify public Pages contract
        run: |
          node scripts/build-pages-public.mjs .pages-public-test
          rm -rf .pages-public-test
      - name: Run automated battery
        run: bash scripts/run-mvp-tests.sh

  build:
    needs: validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Verify approved production homepage payload
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/index.html
          test -f frontend/assets/fia-co-office-approved.jpg
          grep -Fq 'Conecta.' frontend/index.html
          grep -Fq 'Acuerda.' frontend/index.html
          grep -Fq 'Gestiona.' frontend/index.html
          grep -Fq 'Comprueba.' frontend/index.html
          grep -Fq 'assets/fia-co-office-approved.jpg' frontend/index.html
          grep -Fq 'id="servicios"' frontend/index.html
          grep -Fq 'id="participantes"' frontend/index.html
          grep -Fq 'id="confianza"' frontend/index.html
          grep -Fq '@media(max-width:560px)' frontend/index.html
          ! grep -Fq 'PREVIEW VISUAL · no sustituye aún la portada actual' frontend/index.html

      - name: Verify supporting public routes
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/approved-home-preview.html
          test -f frontend/web-beta.html
          test -f frontend/beta-mobile.html

      - name: Build allowlisted public artifact
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-pages-public.mjs pages-public
          printf '%s\n' "$GITHUB_SHA" > pages-public/deploy-version.txt
          test -f pages-public/index.html
          grep -Fq 'Conecta.' pages-public/index.html
          grep -Fq 'Comprueba.' pages-public/index.html
          grep -Fq 'assets/fia-co-office-approved.jpg' pages-public/index.html
          grep -Fq 'id="servicios"' pages-public/index.html
          grep -Fq 'id="participantes"' pages-public/index.html
          grep -Fq 'id="confianza"' pages-public/index.html
          test ! -e pages-public/agent-lab.html
          test ! -e pages-public/backoffice-demo.html
          test ! -e pages-public/audit-trail-lab.html
          test ! -e pages-public/capital-readiness-kit.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify:
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Verify deployed approved homepage and commit
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"

          fetch() {
            local path="$1"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "${base}/${path}?verify=${EXPECTED_SHA}"
          }

          deployed_sha="$(fetch deploy-version.txt | tr -d '\r\n')"
          test "$deployed_sha" = "$EXPECTED_SHA"

          homepage="$(fetch index.html)"
          grep -Fq 'Conecta.' <<<"$homepage"
          grep -Fq 'Acuerda.' <<<"$homepage"
          grep -Fq 'Gestiona.' <<<"$homepage"
          grep -Fq 'Comprueba.' <<<"$homepage"
          grep -Fq 'assets/fia-co-office-approved.jpg' <<<"$homepage"
          grep -Fq 'id="servicios"' <<<"$homepage"
          grep -Fq 'id="participantes"' <<<"$homepage"
          grep -Fq 'id="confianza"' <<<"$homepage"
          ! grep -Fq 'PREVIEW VISUAL · no sustituye aún la portada actual' <<<"$homepage"

          fetch approved-home-preview.html > /dev/null
          fetch web-beta.html > /dev/null
          fetch beta-mobile.html > /dev/null

          printf 'DEPLOY OK — commit %s — approved homepage OK — responsive layout OK\n' "$EXPECTED_SHA"
