name: MVP tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [fia-development, legal-use-cases, wallet-crypto-demo, multiuser-demo, multiuser-hardened]

permissions:
  contents: read

jobs:
  test:
    name: MVP tests (PostgreSQL ${{ matrix.postgres_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres_version: ['16', '17.6']
    services:
      postgres:
        image: postgres:${{ matrix.postgres_version }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fia_inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fia_inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find frontend/js tests scripts core -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Verify public Pages contract
        run: |
          node scripts/build-pages-public.mjs .pages-public-test
          rm -rf .pages-public-test
      - name: Run automated battery
        run: bash scripts/run-mvp-tests.sh
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply complete Supabase migration chain and test inventory
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d fia_inventory_test -v ON_ERROR_STOP=1 -f tests/inventory-postgres-bootstrap.sql
          # Historical bootstrap SQL is intentionally outside Supabase's tracked migration directory.
          for baseline in supabase/baseline/*.sql; do
            echo "Applying baseline $baseline"
            psql -h localhost -U postgres -d fia_inventory_test -v ON_ERROR_STOP=1 -f "$baseline"
          done
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d fia_inventory_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U postgres -d fia_inventory_test -v ON_ERROR_STOP=1 -f tests/inventory-postgres-integration.sql
