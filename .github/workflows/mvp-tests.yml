name: MVP tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [fia-development, legal-use-cases, wallet-crypto-demo, multiuser-demo, multiuser-hardened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find frontend/js tests server scripts core -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Verify public Pages contract
        run: |
          node scripts/build-pages-public.mjs .pages-public-test
          rm -rf .pages-public-test
      - name: Run automated battery
        run: bash scripts/run-mvp-tests.sh
