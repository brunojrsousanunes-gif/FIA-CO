name: MVP tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [fia-development]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run automated battery
        run: node tests/run-tests.mjs
